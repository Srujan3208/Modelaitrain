<rect x="315" y="165" width="58" height="112" rx="27" fill="url(#purple)" stroke="#d5b5ff" stroke-width="5"/>
<circle cx="56" cy="221" r="22" fill="url(#ear)" stroke="#e4ccff" stroke-width="5"/>
