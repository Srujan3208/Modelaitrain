<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<defs>
 <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#e4d7ff"/><stop offset=".62" stop-color="#a47cf0"/><stop offset="1" stop-color="#4d2198"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f5ff"/><stop offset=".42" stop-color="#b7a3e7"/><stop offset=".72" stop-color="#69538f"/><stop offset="1" stop-color="#24143f"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7b7ff"/><stop offset=".45" stop-color="#8b42f3"/><stop offset="1" stop-color="#3b126e"/></linearGradient>
 <radialGradient id="ear"><stop stop-color="#250c4a"/><stop offset=".7" stop-color="#782bd9"/><stop offset="1" stop-color="#d5b5ff"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
